name: Quality Gate

on:
  workflow_call:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck, Unit, E2E, Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8081/api
      NEXT_PUBLIC_IMAGE_BASE_URL: http://localhost:8081
      NEXT_PUBLIC_QRIS_STATIS: 00020101021126570011ID.DANA.WWW011893600915348406432302094840643230303UMI51440014ID.CO.QRIS.WWW0215ID10232809145820303UMI5204839853033605802ID5918www.filantropi.net6015Kota Jakarta Ti61051322063049E94

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency produksi
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit test
        run: npm test

      - name: Install browser Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E test
        run: npm run test:e2e

      - name: Build produksi
        run: npm run build
