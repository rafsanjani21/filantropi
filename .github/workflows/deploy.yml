name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Eksekusi Perintah SSH ke VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # 🔥 Memuat NVM dan konfigurasi path agar npm & pm2 terbaca
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            source ~/.bashrc

            # Perintah deploy asli Anda
            pm2 delete "Filantropi LP" || true
            cd /home/devlanding/filantropi_lp/filantropi-main
            git pull
            npm install
            npm run build
            pm2 start npm --name "Filantropi LP" -- start -- --port 3005
            pm2 save