name: Deploy to VPS

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  deploy:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Eksekusi Perintah SSH ke VPS
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # REKOMENDASI 4: Tambahkan fingerprint untuk keamanan MITM (buat secret VPS_SSH_FINGERPRINT di GitHub)
          # fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }} 
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # REKOMENDASI 3: Memastikan VPS memakai versi Node.js yang stabil (Pin Node 22)
            nvm install 22
            nvm use 22
            npm install -g pm2
            export PATH=$PATH:/usr/local/bin:/usr/bin

            cd /home/devlanding/filantropi_lp/filantropi-main

            PREVIOUS_COMMIT=$(git rev-parse HEAD)
            APP_NAME="Filantropi LP"
            APP_PORT=3005

            git fetch origin
            git reset --hard origin/main

            rollback() {
              echo "Deploy gagal — rollback ke $PREVIOUS_COMMIT"
              git reset --hard "$PREVIOUS_COMMIT"
              npm ci
              npm run build
              
              if [ -d ".next/standalone" ]; then
                cp -r public .next/standalone/ || true
                cp -r .next/static .next/standalone/.next/ || true
                rm -rf node_modules
                pm2 delete "$APP_NAME" || true
                # REKOMENDASI 1: Ubah 0.0.0.0 menjadi 127.0.0.1 agar tidak bisa ditembus langsung dari IP Publik
                PORT=$APP_PORT HOSTNAME=127.0.0.1 pm2 start .next/standalone/server.js --name "$APP_NAME"
              else
                pm2 delete "$APP_NAME" || true
                PORT=$APP_PORT HOSTNAME=127.0.0.1 pm2 start node_modules/next/dist/bin/next --name "$APP_NAME" -i 1 -- start -p "$APP_PORT"
              fi
              pm2 save
            }

            if ! npm ci; then
              rollback
              exit 1
            fi
            if ! npm run build; then
              rollback
              exit 1
            fi

            cp -r public .next/standalone/ || true
            cp -r .next/static .next/standalone/.next/ || true
            rm -rf node_modules

            pm2 delete "$APP_NAME" || true
            
            # REKOMENDASI 1: Mengunci aplikasi murni hanya untuk diakses proxy lokal (Nginx)
            PORT=$APP_PORT HOSTNAME=127.0.0.1 pm2 start .next/standalone/server.js --name "$APP_NAME"

            HEALTH_OK=0
            for i in $(seq 1 12); do
              if curl -fsS "http://127.0.0.1:${APP_PORT}/" >/dev/null 2>&1; then
                HEALTH_OK=1
                break
              fi
              sleep 5
            done

            if [ "$HEALTH_OK" != "1" ]; then
              echo "Healthcheck gagal setelah deploy."
              rollback
              exit 1
            fi

            pm2 save
            echo "Deploy sukses dan healthcheck lolos."